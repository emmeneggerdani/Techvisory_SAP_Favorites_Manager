<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>SAP Favoriten-Manager</title>
<link rel="icon" type="image/png" href="assets/Techvisory_Kolibri.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header>
  <img class="brand-logo" src="assets/Techvisory_Logo.png" alt="Techvisory">
  <h1>SAP Favoriten-Manager</h1>
  <span class="sub">lokal &middot; läuft im Browser &middot; MENU_FAVORITES_UPLOAD/DOWNLOAD-kompatibel</span>
</header>

<div class="toolbar">
  <button id="btn-import">📂 SAP-Favoriten laden</button>
  <button id="btn-export" class="primary">⭳ SAP-Favoriten exportieren</button>
  <div class="sep"></div>
  <button id="btn-json-save">💾 JSON speichern</button>
  <button id="btn-json-load">📂 JSON laden</button>
  <div class="sep"></div>
  <button id="btn-tcodedb-load">🗂 TCode-Datenbank laden</button>
  <div class="sep"></div>
  <button id="btn-dupes">🧭 Duplikate finden</button>
  <button id="btn-reset" class="danger">♻ Alles löschen</button>
  <input type="file" id="file-input-sap" accept=".txt">
  <input type="file" id="file-input-json" accept=".json">
  <input type="file" id="file-input-tcodedb" accept=".json">
  <span class="count" id="count-badge"></span>
</div>

<div class="toolbar">
  <button id="btn-add-folder">+ Ordner</button>
  <button id="btn-add-tr">+ Transaktion</button>
  <button id="btn-add-ot">+ OT-Objekt</button>
  <div class="sep"></div>
  <button id="btn-edit" disabled>✎ Bearbeiten</button>
  <button id="btn-copy" disabled>⧉ Kopieren</button>
  <button id="btn-paste" disabled>📋 Einfügen</button>
  <button id="btn-delete" class="danger" disabled>🗑 Löschen</button>
</div>

<div class="toolbar" id="connection-bar"></div>

<main>
  <div id="tree-col">
    <div class="search-bar">
      <input type="text" id="search-input" placeholder="Suche nach Code, Bezeichnung oder URL…">
      <button id="btn-search-clear">✕</button>
    </div>
    <div id="tree-panel"></div>
  </div>
  <div id="side-panel"><div id="side-content"></div></div>
</main>

<footer id="footer-msg">Noch keine Favoriten geladen — lade eine bestehende Datei oder lege direkt neue Ordner/Einträge an. Änderungen werden automatisch lokal im Browser gespeichert.</footer>

<script src="js/format.js"></script>
<script src="js/store.js"></script>
<script src="js/filestore.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
